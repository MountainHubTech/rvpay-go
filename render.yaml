# Render Blueprint for rvpay-go
# Uses Render's Free Tier exclusively.
# Creates one new Free PostgreSQL instance shared between both services.
# See https://render.com for the full schema.

services:
  - type: web
    name: rvpay-clients
    plan: free
    runtime: docker
    repo: https://github.com/MountainHubTech/rvpay-go
    branch: main
    dockerfilePath: ./clients/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LISTEN_PORT
        value: "50051"
      - key: MIGRATION_PATH
        value: /app/clients/db/migrations
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DB_TLS_DISABLED
        value: "false"
      - key: DB_HOST
        fromDatabase:
          name: rvpay-shared-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rvpay-shared-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: rvpay-shared-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rvpay-shared-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: rvpay-shared-postgres
          property: database
      - key: HIGHLEVEL_CLIENT_ID
        sync: false
      - key: HIGHLEVEL_CLIENT_SECRET
        sync: false
      - key: HIGHLEVEL_REDIRECT_URI
        sync: false
      - key: HIGHLEVEL_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: HIGHLEVEL_PAYMENT_URL
        sync: false
      - key: HIGHLEVEL_QUERY_URL
        sync: false
      - key: HIGHLEVEL_PROVIDER_NAME
        sync: false
      - key: HIGHLEVEL_PROVIDER_DESCRIPTION
        sync: false
      - key: HIGHLEVEL_PROVIDER_IMAGE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HIGHLEVEL_API_BASE_URL
        sync: false
      - key: TRANSACTIONS_GRPC_ADDR
        fromService:
          type: web
          name: rvpay-transactions
          property: hostport

  - type: web
    name: rvpay-transactions
    plan: free
    runtime: docker
    repo: https://github.com/MountainHubTech/rvpay-go
    branch: main
    dockerfilePath: ./transactions/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LISTEN_PORT
        value: "50051"
      - key: MIGRATION_PATH
        value: /app/transactions/db/migrations
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DB_TLS_DISABLED
        value: "false"
      - key: DB_HOST
        fromDatabase:
          name: rvpay-shared-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rvpay-shared-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: rvpay-shared-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rvpay-shared-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: rvpay-shared-postgres
          property: database

databases:
  - name: rvpay-shared-postgres
    plan: free
    databaseName: rvpay_testing
    user: rvpay_user
