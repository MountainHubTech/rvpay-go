# Contabo delivery pipeline: test Go, publish clients+transactions images to
# GHCR, then restart the Contabo Compose stack over SSH. Modeled on the
# dormant OCI pipeline (deploy.yml) but targets both current services and a
# plain x86_64 VPS instead of a single legacy ARM64 service.
name: Deploy to Contabo

# Manual trigger only for now: Render is still the live pipeline on main, and
# this shouldn't fire a second, concurrent deploy until Contabo is the agreed
# cutover target. Add `push: branches: [main]` once that decision is made.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [clients, transactions]
    outputs:
      clients_image: ${{ steps.image.outputs.clients }}
      transactions_image: ${{ steps.image.outputs.transactions }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/rvpay-go-${{ matrix.service }}:${{ github.sha }}
      - id: image
        run: echo "${{ matrix.service }}=${{ env.REGISTRY }}/${{ github.repository_owner }}/rvpay-go-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
      - name: Pull images and restart services
        env:
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
          CONTABO_USER: ${{ secrets.CONTABO_USER }}
          CLIENTS_IMAGE: ${{ needs.build-and-push.outputs.clients_image }}
          TRANSACTIONS_IMAGE: ${{ needs.build-and-push.outputs.transactions_image }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$CONTABO_USER@$CONTABO_HOST" \
            "cd /opt/rvpay-go && \
             CLIENTS_IMAGE='$CLIENTS_IMAGE' TRANSACTIONS_IMAGE='$TRANSACTIONS_IMAGE' \
             docker compose -f docker-compose.contabo.yml pull clients transactions && \
             CLIENTS_IMAGE='$CLIENTS_IMAGE' TRANSACTIONS_IMAGE='$TRANSACTIONS_IMAGE' \
             docker compose -f docker-compose.contabo.yml up -d --no-build --remove-orphans"
