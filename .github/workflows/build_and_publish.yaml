name: Build and Publish

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  debug-oidc:
    name: Debug GitHub OIDC
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: testing

    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              print(f"{key}: {claims.get(key)}")
          PY

  build:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    environment:
      name: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1           # <-- Change this from ${{ env.AWS_REGION }} to a hardcoded string
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories \
            --repository-names rvpay/clients \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name rvpay/clients

          aws ecr describe-repositories \
            --repository-names rvpay/transactions \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name rvpay/transactions

          aws ecr describe-repositories \
            --repository-names rvpay/admindashboard \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name rvpay/admindashboard

      - name: Build clients image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/rvpay/clients:${GITHUB_SHA}" \
            -f clients/Dockerfile \
            .

      - name: Build transactions image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/rvpay/transactions:${GITHUB_SHA}" \
            -f transactions/Dockerfile \
            .
      
      - name: Build admindashboard image
        run: |
          docker build \
            --no-cache \
            -t "${ECR_REGISTRY}/rvpay/admindashboard:${GITHUB_SHA}" \
            -f admindashboard/Dockerfile \
            admindashboard

      - name: Push clients image
        run: |
          docker push \
            "${ECR_REGISTRY}/rvpay/clients:${GITHUB_SHA}"

      - name: Push transactions image
        run: |
          docker push \
            "${ECR_REGISTRY}/rvpay/transactions:${GITHUB_SHA}"

      - name: Push admindashboard image
        run: |
          docker push \
            "${ECR_REGISTRY}/rvpay/admindashboard:${GITHUB_SHA}"