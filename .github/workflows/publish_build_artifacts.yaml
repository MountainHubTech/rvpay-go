name: Publish Build Artifacts

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "infra/**"
      - ".github/workflows/publish_build_artifacts.yaml"
      - "infra/cloudformation/Makefile"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-infra:
    name: Publish CloudFormation Artifacts
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Calculate infrastructure release hash
        id: infra
        run: |
          HASH=$(find ./infra/ \
            -type f \
            -exec sha256sum {} + | \
            sort | \
            sha256sum | \
            cut -f 1 -d ' ')

          echo "release_hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Publish CloudFormation artifacts
        env:
          BUCKET_NAME: ${{ secrets.CLOUDFORMATION_ARTIFACTS_BUCKET }}
          ARTIFACT_HASH: ${{ steps.infra.outputs.release_hash }}
        run: |
          make -C infra/cloudformation publish \
            bucket_name="$BUCKET_NAME" \
            artifact_hash="$ARTIFACT_HASH"

      - name: Store infrastructure release hash
        env:
          ARTIFACT_HASH: ${{ steps.infra.outputs.release_hash }}
        run: |
          aws ssm put-parameter \
            --name "/build-artifact/infra/${GITHUB_REF_NAME}" \
            --type String \
            --value "$ARTIFACT_HASH" \
            --overwrite