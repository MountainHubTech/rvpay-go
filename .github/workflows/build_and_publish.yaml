name: Build and Publish

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories \
            --repository-names rvpay/clients \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name rvpay/clients

          aws ecr describe-repositories \
            --repository-names rvpay/transactions \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name rvpay/transactions

      - name: Build clients image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/rvpay/clients:${GITHUB_SHA}" \
            -f clients/Dockerfile \
            .

      - name: Build transactions image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/rvpay/transactions:${GITHUB_SHA}" \
            -f transactions/Dockerfile \
            .

      - name: Push clients image
        run: |
          docker push \
            "${ECR_REGISTRY}/rvpay/clients:${GITHUB_SHA}"

      - name: Push transactions image
        run: |
          docker push \
            "${ECR_REGISTRY}/rvpay/transactions:${GITHUB_SHA}"