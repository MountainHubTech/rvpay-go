# Contabo edge proxy: port 80 redirects to HTTPS; port 443 terminates TLS and
# routes to each service. This mirrors the real AWS ALB routing
# (infra/cloudformation/services/{clients,transactions,admindashboard}.yaml),
# NOT a one-subdomain-per-service split: clients and transactions share one
# API hostname, split by path prefix, and admindashboard gets its own
# hostname. Replace api.your-domain.com and admindashboard.your-domain.com
# with the real hostnames before deploying.
#
# Raw gRPC between clients and transactions is never exposed here — it stays
# on the private Compose network (see docker-compose.contabo.yml).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # api.your-domain.com: clients and transactions, split by path prefix
    # (same split as the ALB listener rules in clients.yaml/transactions.yaml).
    server {
        listen 8443 ssl;
        http2 on;
        server_name api.your-domain.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Clients: REST gateway, OAuth callback, GHL Custom Payment Provider,
        # and the inbound HighLevel webhook. The AWS ALB rules omit
        # /webhooks/highlevel* entirely (an existing gap there, not
        # reproduced here) — it is included below so the route actually works.
        location ~ ^/(v1/public/(clients|integrations|platforms)|oauth/callback|payments/custom-provider|webhooks/highlevel) {
            proxy_pass http://clients:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transactions: merchants, customers, deposits, payments, payouts,
        # the transactions REST surface, and its /v1/public/transactions/healthcheck.
        location ~ ^/v1/public/(merchants|customers|deposits|payments|payouts|transactions) {
            proxy_pass http://transactions:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # admindashboard.your-domain.com: the Next.js dashboard, catch-all.
    server {
        listen 8443 ssl;
        http2 on;
        server_name admindashboard.your-domain.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://admindashboard:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
