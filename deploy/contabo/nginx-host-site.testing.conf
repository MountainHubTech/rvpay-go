# Host-nginx site for the RVPay testing environment on a VPS that already runs
# nginx for other sites (used with docker-compose.contabo.hostnginx.yml).
# Same routing as nginx.conf, but proxying to the loopback ports set in
# /opt/rvpay-testing/.env. Install as /etc/nginx/sites-available/rvpay-testing,
# symlink into sites-enabled, then run certbot --nginx for both hostnames to
# add the TLS server blocks.
#
# The hostnames are temporary sslip.io names that resolve to the VPS IP;
# swap them for the real api./admindashboard. domain once DNS is pointed here.

# api.*: clients and transactions, split by path prefix.
server {
    listen 80;
    listen [::]:80;
    server_name api.testing.75-119-147-69.sslip.io api.rvpay.xyz;

    # Clients: REST gateway, OAuth callback, GHL Custom Payment Provider,
    # and the inbound HighLevel webhook.
    location ~ ^/(v1/public/(auth|clients|integrations|platforms)|oauth/callback|payments/custom-provider|webhooks/highlevel) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Transactions: merchants, customers, deposits, payments, payouts, and
    # the transactions REST surface.
    location ~ ^/v1/public/(merchants|customers|deposits|payments|payouts|transactions) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# admindashboard.*: the Next.js dashboard, catch-all.
server {
    listen 80;
    listen [::]:80;
    server_name admindashboard.testing.75-119-147-69.sslip.io admindashboard.rvpay.xyz;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
