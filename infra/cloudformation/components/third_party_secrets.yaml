AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates in AWS Secrets Manager secrets for RVPay third-party services"

Parameters:
  EnvId:
    Type: String
    Description: Environment Id (used to namespace resources)
    AllowedPattern: "[a-z][a-z0-9]{2,19}"
    ConstraintDescription: Must be lower case letters between 3 and 20 characters.

Resources:
  HighLevelClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${EnvId}/highlevel_client"
      GenerateSecretString:
        SecretStringTemplate: '{"client_id": "placeholder", "client_secret": "placeholder"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludePunctuation: true
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

  PawapaySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${EnvId}/pawapay"
      SecretString: '{"api_url": "", "api_key": ""}'
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

  HighLevelProviderConfigs:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${EnvId}/highlevel_provider_configs"
      SecretString: '{"live_api_key": "placeholder", "live_publishable_key": "placeholder", "test_api_key": "placeholder", "test_publishable_key": "placeholder"}'
      Tags:
        - Key: EnvId
          Value: !Ref EnvId
  
  HighLevelEnvironmentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${EnvId}/highlevel_environment"
      SecretString: '{"high_level_redirect_url": "https://api.rvpay.xyz/oauth/callback", "high_level_payment_url": "https://admindashboard.rvpay.xyz/payment", "high_level_query_url": "https://api.rvpay.xyz/payments/custom-provider/query", "high_level_provider_image_url": "https://rvpay-temp-image-bucket-12345.s3.us-east-1.amazonaws.com/rvpay_logomark-main-blue.png"}'
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

Outputs:
  HighLevelClientSecretArn:
    Description: "HighLevel client credentials secret ARN"
    Value: !Ref HighLevelClientSecret

  HighLevelEnvironmentSecretArn:
    Description: "HighLevel environment configuration secret ARN"
    Value: !Ref HighLevelEnvironmentSecret

  PawapaySecretArn:
    Description: "PawaPay API credentials secret ARN"
    Value: !Ref PawapaySecret

  HighLevelProviderConfigsArn:
    Description: "HighLevel payment provider live/test processing keys secret ARN"
    Value: !Ref HighLevelProviderConfigs