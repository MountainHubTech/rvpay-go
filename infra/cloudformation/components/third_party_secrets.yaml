AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates in AWS Secrets Manager secrets for RVPay third-party services"

Parameters:
  EnvId:
    Type: String
    Description: Environment Id (used to namespace resources)
    AllowedPattern: "[a-z][a-z0-9]{2,19}"
    ConstraintDescription: Must be lower case letters between 3 and 20 characters.

Resources:
  HighLevelClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${EnvId}/highlevel_client"
      GenerateSecretString:
        SecretStringTemplate: '{"client_id": "placeholder", "client_secret": "placeholder"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludePunctuation: true
      Tags:
        - Key: EnvId
          Value: !Ref EnvId

Outputs:
  HighLevelClientSecretArn:
    Description: "HighLevel client credentials secret ARN"
    Value: !Ref HighLevelClientSecret